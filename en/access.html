<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Member access · Aboji Exercise</title><style>body{margin:0;min-height:100svh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 60% 20%,#1c5063,#081a29 65%);color:#fff;font:16px/1.7 "Avenir Next",Arial,sans-serif}.panel{width:min(100%,520px);padding:clamp(25px,6vw,54px);border:1px solid #d8bb80aa;background:#081a29e8}small{color:#d8bb80;letter-spacing:.18em}h1{font:normal clamp(34px,7vw,53px)/1.15 Georgia,serif}p{color:#d2dfe1}button{padding:15px 22px;border:0;background:#d8bb80;color:#081a29;font-weight:800;cursor:pointer}#message{margin-top:20px}</style></head><body><main class="panel"><small>ABOJI EXERCISE · MEMBERS</small><h1>Your practice space awaits.</h1><p>Continue to your member page. This access link can be used once; your browser will stay signed in for 30 days.</p><button id="enter">Enter member area →</button><p id="message" role="status"></p></main><script>document.querySelector("#enter").onclick=async()=>{const b=document.querySelector("#enter"),m=document.querySelector("#message");b.disabled=true;try{const r=await fetch("/api/en/access",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:new URLSearchParams(location.search).get("token")})});const d=await r.json();if(!r.ok)throw Error(d.message||"The link is invalid.");location.replace(d.next)}catch(e){m.textContent=e.message;b.disabled=false}};</script></body></html>
